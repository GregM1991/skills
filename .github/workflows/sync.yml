name: Sync upstream skills

on:
  schedule:
    # Run every day at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Test sync tooling
        run: bun test scripts/vendor-overlays.test.ts

      - name: Sync upstream skills
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Starting complete sync attempt ${attempt} of 3."
            if bun scripts/sync-upstream.ts; then
              echo "Complete sync attempt ${attempt} succeeded."
              exit 0
            fi

            if [[ "${attempt}" -lt 3 ]]; then
              echo "Complete sync attempt ${attempt} failed. Retrying in 10 seconds."
              sleep 10
            fi
          done

          echo "::error::All 3 complete sync attempts failed."
          exit 1

      - name: Commit and push generated changes
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail

          changes="$(git status --porcelain=v1 --untracked-files=all -- sources.json skills/vendor)"
          if [[ -z "${changes}" ]]; then
            echo "The sync completed with no generated changes."
            exit 0
          fi

          echo "Generated changes:"
          printf '%s\n' "${changes}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- sources.json skills/vendor

          if git diff --cached --quiet --; then
            echo "The sync completed with no staged generated changes."
            exit 0
          fi

          git commit -m "chore: sync upstream skills"
          git pull --rebase origin main
          git push origin HEAD:main
